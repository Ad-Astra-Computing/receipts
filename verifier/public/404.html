<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#0b0b0d" />
  <style>
    :root {
      --ink-0: #0b0b0d; --ink-1: #17171a; --bone-0: #f0efed; --bone-1: #b4b3b7; --bone-2: #85848b;
      --hairline: rgba(240, 239, 237, 0.09); --focus: #6f6f77;
      --font-serif: "Charter", "Iowan Old Style", "Source Serif Pro", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ink-0); color: var(--bone-1); font-family: var(--font-sans);
      font-size: 1.0625rem; line-height: 1.65; max-width: 41rem; margin: 0 auto;
      padding: 3.5rem 1.5rem 5rem;
    }
    .back { display: inline-block; color: var(--bone-2); font-size: 0.8125rem; text-decoration: none;
      border-bottom: 1px solid transparent; margin-bottom: 2rem; }
    .back:hover { color: var(--bone-0); border-color: var(--hairline); }
    h1 { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.01em;
      color: var(--bone-0); font-size: 1.719rem; line-height: 1.2; margin-bottom: 0.35rem; }
    h2 { font-family: var(--font-serif); font-weight: 500; color: var(--bone-0);
      font-size: 1.0625rem; margin: 2.25rem 0 0.6rem; }
    .updated { font-family: var(--font-mono); font-size: 0.656rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--bone-2); margin-bottom: 2.5rem; }
    p { margin-bottom: 0.9rem; }
    ul { margin: 0 0 0.9rem 1.25rem; }
    li { margin-bottom: 0.4rem; }
    a { color: var(--bone-0); text-decoration: none; border-bottom: 1px solid var(--hairline); }
    a:hover { border-color: var(--bone-2); }
    a:focus-visible, .back:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
    code { font-family: var(--font-mono); font-size: 0.9em; color: var(--bone-0); }
    .rule { height: 1px; background: var(--hairline); margin: 3rem 0 1.5rem; border: 0; }
    footer { font-size: 0.8125rem; color: var(--bone-2); display: flex; flex-wrap: wrap;
      gap: 0.5rem 1rem; justify-content: space-between; }
    .adastra-mark { width: 0.875rem; height: 0.875rem; vertical-align: -0.125em; margin-right: 0.4rem; }
    footer .co { display: inline-flex; align-items: center; }
    footer a { color: var(--bone-2); border: 0; }
    footer a:hover { color: var(--bone-0); }
  </style>
</head>

</html>
